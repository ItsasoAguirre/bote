name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Without this it uses the repository default branch (develop).
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs here and not on a tag trigger: tags created with GITHUB_TOKEN don't start other workflows.
  deploy-prod:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      HUSKY: 0
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export web
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_APP_ENV: prod

      - name: Deploy to bote.expo.app
        run: npx eas-cli@latest deploy --prod --non-interactive

  # Brings the version bump and CHANGELOG back to develop.
  back-merge:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Open main → develop pull request
        run: |
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --base develop --head main --state open --json number --jq '.[].number')" ]; then
            echo "A main → develop pull request is already open."
            exit 0
          fi
          gh pr create -R "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: sync main into develop after $TAG" \
            --body "Devuelve a \`develop\` el cambio de versión y el CHANGELOG de $TAG. Fusionar con **merge commit** (no squash)."
