name: Deploy web (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      HUSKY: 0
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Export web
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_APP_ENV: dev

      - name: Deploy to bote--dev.expo.app
        # --environment gives the web server EXPO_PUBLIC_APP_ENV (EAS env var, preview = dev): server code
        # reads it at runtime instead of having it written in at build time.
        run: npx eas-cli@latest deploy --alias dev --environment preview --non-interactive
